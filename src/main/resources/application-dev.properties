# =============================================================================
# DATABASE & PERSISTENCE (PostgreSQL & Flyway)
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/webhook_gateway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}


# =============================================================================
# BROKER & CACHE CONFIGURATION (RabbitMQ & Redis)
# =============================================================================
# Full connection string (supports amqp://, amqps://, credentials, ports, and vhost)
spring.rabbitmq.addresses=${SPRING_RABBITMQ_URL:amqp://guest:guest@localhost:5672}

# RabbitMQ Message Broker Connection Settings
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Hook-Shuttle Custom Redis Configuration (Supports single or cluster mode)
hook-shuttle.redis.mode=single
# Full connection string (supports redis://, rediss://, auth, and ports)
hook-shuttle.redis.url=${REDIS_URL:redis://localhost:6379}

# Cluster Mode Setup (Uncomment if deploying in a clustered environment)
# hook-shuttle.redis.mode=cluster
# hook-shuttle.redis.cluster-nodes=redis://10.0.0.1:6379,redis://10.0.0.2:6379,redis://10.0.0.3:6379


# =============================================================================
# SECURITY, AUTHENTICATION & ENCRYPTION
# =============================================================================
# JSON Web Token (JWT) Configuration
jwt.secret=${JWT_SECRET:c35ed38012469a2ffe81ec01a2e8e04dd6e2ecb848cecabb8f503056a7fd8628}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Cookie Policy (HTTP ok for local dev)
hook-shuttle.auth.refresh.secure-cookie=false

# AES-256 Symmetric Encryption Key (32-byte Base64 string for secure secret storage)
hook-shuttle.security.encryption-key=${ENCRYPTION_KEY:6qlZF66XR5hJ1g1qkGWCf8noobfc/LTHpW5mtUNUez0=}


# =============================================================================
# INFRASTRUCTURE, CORS & DEPLOYMENT TOGGLES
# =============================================================================
# Cross-Origin Resource Sharing (CORS) Configuration
hook-shuttle.cors.enabled=${CORS_ENABLED:false}
hook-shuttle.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5000,http://localhost:3000}