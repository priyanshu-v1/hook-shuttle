# =============================================================================
# APPLICATION CORE CONFIGURATION
# =============================================================================
spring.application.name=webhook-gateway
server.port=8080


# =============================================================================
# DATABASE & PERSISTENCE (PostgreSQL & Flyway)
# =============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/webhook_gateway
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings (validate production schemas; SQL logging commented out)
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Global Jackson JSON Serialization (Standardize snake_case for payloads)
spring.jackson.property-naming-strategy=SNAKE_CASE


# =============================================================================
# BROKER & CACHE CONFIGURATION (RabbitMQ & Redis)
# =============================================================================
# RabbitMQ Message Broker Connection Settings
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Hook-Shuttle Custom Redis Configuration (Supports single or cluster mode)
hook-shuttle.redis.mode=single
hook-shuttle.redis.host=localhost
hook-shuttle.redis.port=6379

# Cluster Mode Setup (Uncomment if deploying in a clustered environment)
# hook-shuttle.redis.mode=cluster
# hook-shuttle.redis.cluster-nodes=10.0.0.1:6379,10.0.0.2:6379,10.0.0.3:6379


# =============================================================================
# SECURITY, AUTHENTICATION & ENCRYPTION
# =============================================================================
# JSON Web Token (JWT) Configuration
jwt.secret=${JWT_SECRET:c35ed38012469a2ffe81ec01a2e8e04dd6e2ecb848cecabb8f503056a7fd8628}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Refresh Token Lifecycle & Cookie Policy
hook-shuttle.auth.refresh.sliding-window=7d
hook-shuttle.auth.refresh.absolute-ceiling=30d
hook-shuttle.auth.refresh.secure-cookie=false

# AES-256 Symmetric Encryption Key (32-byte Base64 string for secure secret storage)
hook-shuttle.security.encryption-key=${ENCRYPTION_KEY:6qlZF66XR5hJ1g1qkGWCf8noobfc/LTHpW5mtUNUez0=}


# ==========================================
# HOOK-SHUTTLE RETRY & BACKOFF CONFIGURATION
# ==========================================

# Maximum delay allowed in Redis RDelayedQueue (in seconds). 
# Retries exceeding this cap (default 3600s / 1 hour) are offloaded to PostgreSQL cold storage.
hook-shuttle.retry.redis-delay-cap-seconds=3600

# Base multiplier for exponential backoff calculation (base^attemptNumber).
# Default is 2 for standard binary exponential backoff.
hook-shuttle.retry.backoff-base=2

# Maximum random jitter (in seconds) added to retry delays 
# to prevent thundering herd problems when multiple webhooks fail simultaneously.
hook-shuttle.retry.jitter-seconds=5


# =============================================================================
# INFRASTRUCTURE, CORS & DEPLOYMENT TOGGLES
# =============================================================================
# Cross-Origin Resource Sharing (CORS) Configuration
hook-shuttle.cors.enabled=true
hook-shuttle.cors.allowed-origins=http://localhost:5000,https://your-frontend-domain.com

# Frontend Serving Toggle (Serve built static assets directly from the gateway if enabled)
hook-shuttle.serve-frontend=false
