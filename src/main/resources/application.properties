spring.application.name=webhook-gateway

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/webhook_gateway
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server Configuration
server.port=8080

spring.jpa.open-in-view=false


#JWT Configuration
jwt.secret=${JWT_SECRET:c35ed38012469a2ffe81ec01a2e8e04dd6e2ecb848cecabb8f503056a7fd8628}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AES-256 Symmetric Encryption Key (32-byte Base64 string)
webhook-gateway.security.encryption-key=${ENCRYPTION_KEY:6qlZF66XR5hJ1g1qkGWCf8noobfc/LTHpW5mtUNUez0=}

# RabbitMQ Connection Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


# Custom Webhook Gateway Redis Configuration
webhook-gateway.redis.mode=single
webhook-gateway.redis.host=localhost
webhook-gateway.redis.port=6379

# Cluster Mode setup
# webhook-gateway.redis.mode=cluster
# webhook-gateway.redis.cluster-nodes=10.0.0.1:6379,10.0.0.2:6379,10.0.0.3:6379