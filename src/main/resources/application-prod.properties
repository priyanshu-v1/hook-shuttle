# =============================================================================
# DATABASE & PERSISTENCE (PostgreSQL & Flyway)
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# =============================================================================
# BROKER & CACHE CONFIGURATION (RabbitMQ & Redis)
# =============================================================================
# RabbitMQ Message Broker Connection Settings
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Hook-Shuttle Custom Redis Configuration (Supports single or cluster mode)
hook-shuttle.redis.mode=${REDIS_MODE:single}
hook-shuttle.redis.host=${REDIS_HOST}
hook-shuttle.redis.port=${REDIS_PORT}

# Cluster Mode Setup (Uncomment if deploying in a clustered environment)
# hook-shuttle.redis.mode=cluster
# hook-shuttle.redis.cluster-nodes=${REDIS_CLUSTER_NODES}


# =============================================================================
# SECURITY, AUTHENTICATION & ENCRYPTION
# =============================================================================
# JSON Web Token (JWT) Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Cookie Policy (Strict HTTPS enforcement in production)
hook-shuttle.auth.refresh.secure-cookie=true

# AES-256 Symmetric Encryption Key (32-byte Base64 string for secure secret storage)
hook-shuttle.security.encryption-key=${ENCRYPTION_KEY}


# =============================================================================
# INFRASTRUCTURE, CORS & DEPLOYMENT TOGGLES
# =============================================================================
# Cross-Origin Resource Sharing (CORS) Configuration
hook-shuttle.cors.enabled=false
hook-shuttle.cors.allowed-origins=${ALLOWED_ORIGINS}