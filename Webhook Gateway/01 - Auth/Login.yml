info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/auth/login
  body:
    type: json
    data: |-
      {
        "email": "admin@example.com",
        "password": "SecurePassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
